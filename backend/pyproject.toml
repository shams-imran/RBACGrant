[project]
name = "rbacgrant"
version = "0.1.0"
description = "Web GUI that builds Kubernetes RBAC manifests and kubeconfigs, with linting, guardrails and multi-cluster apply"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "ruamel.yaml>=0.18",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "hvac>=2.3",
    # Upper bound deliberate: ApiClient.call_api is regenerated across major
    # releases (36 -> 37 split it into param_serialize/call_api/
    # response_deserialize). app/k8s/operations.py handles both, but a new
    # major needs testing before it ships in the image.
    "kubernetes>=30.1,<38",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[project.scripts]
rbac-ui = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Without these the wheel ships only .py files: a pip-installed rbac-ui
# crashed on the missing common-password list, and the API would serve zero
# starter templates. The image's server dodged it only because it runs from
# the copied source tree, not from site-packages.
app = ["auth/common_passwords.txt", "templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
