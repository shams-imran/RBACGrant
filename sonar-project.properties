# SonarCloud configuration.
#
# projectKey and organization must match exactly what SonarCloud shows under
# Administration -> Update Key / the organization page. When a repository is
# imported from GitHub the defaults are "<github-owner>_<repo>" and the
# lowercased owner, which is what is set below.
sonar.projectKey=shams-imran_RBACGrant
sonar.organization=shams-imran
sonar.projectName=RBACGrant

# --- what to analyse -------------------------------------------------------
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,backend/tests/**

# Generated, vendored or binary content carries no useful signal.
sonar.exclusions=\
  backend/app/catalog/data/**,\
  backend/app/auth/common_passwords.txt,\
  frontend/dist/**,\
  docs/screenshots/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  .venv/**

# --- coverage --------------------------------------------------------------
# Produced by: pytest --cov=app --cov-report=xml:coverage.xml
#              vitest run --coverage
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
