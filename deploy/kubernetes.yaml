# RBACGrant on Kubernetes — hardened single-replica deployment.
#
# Before applying:
#   1. Build/push the image somewhere the cluster can pull it, then change
#      spec.template.spec.containers[0].image below.
#   2. Create the config secret from your .env (edit PUBLIC_URL etc. first):
#        kubectl -n rbacgrant create secret generic rbacgrant-env \
#          --from-env-file=.env
#   3. Create the store-key secret (the AES key for the local cluster store):
#        kubectl -n rbacgrant create secret generic rbacgrant-store-key \
#          --from-file=store.key=/path/to/store.key
#   4. kubectl apply -f deploy/kubernetes.yaml
#
# TLS: this manifest serves plain HTTP inside the cluster and expects TLS to
# terminate at your Ingress / LoadBalancer (hence ALLOW_INSECURE_HTTP=true
# below). Set RBAC_UI_PUBLIC_URL in the env secret to the https:// URL users
# will open, and RBAC_UI_ALLOWED_HOSTS to its hostname.
apiVersion: v1
kind: Namespace
metadata:
  name: rbacgrant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rbacgrant
  namespace: rbacgrant
# The app talks to managed clusters with the kubeconfigs you upload, not with
# this in-cluster identity — so no token is mounted and no RBAC is bound.
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rbacgrant-data
  namespace: rbacgrant
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rbacgrant
  namespace: rbacgrant
  labels:
    app.kubernetes.io/name: rbacgrant
spec:
  replicas: 1
  strategy:
    type: Recreate # sessions and the RWO data volume want one pod at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: rbacgrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rbacgrant
    spec:
      serviceAccountName: rbacgrant
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rbacgrant
          # Pinned by digest: tags move, digests do not. Verify it with
          # cosign before rolling it out (see docs/RELEASING.md).
          image: shamsimran/rbacgrant@sha256:ffe990c3d7f02a3d6259b2a4149af2fb60808398bc32e14076b0b9cfe9cd7fa9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: rbacgrant-env
          env:
            # Explicit env wins over envFrom — these pin the values that must
            # differ inside a pod, whatever the .env secret says.
            - name: RBAC_UI_BIND_ADDR
              value: 0.0.0.0
            - name: RBAC_UI_ALLOW_INSECURE_HTTP
              value: "true" # TLS terminates at the Ingress
            - name: RBAC_UI_DATA_DIR
              value: /data
            # A subdirectory of the mount, not the mount itself. The kubelet
            # creates an fsGroup emptyDir as drwxrwsrwt root:10001, which this
            # user cannot chmod and the server refuses as world-accessible.
            # Creating our own directory inside it gives a 0700 dir we own.
            - name: RBAC_UI_RUNTIME_DIR
              value: /run/rbac-ui/work
            - name: RBAC_UI_STORE_KEY_REF
              value: file:/etc/rbac-ui/store.key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /run/rbac-ui
            - name: store-key
              mountPath: /etc/rbac-ui
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The kubelet probes by pod IP, which is not in RBAC_UI_ALLOWED_HOSTS
          # and is rejected as a DNS-rebinding attempt (400). Send an allowed
          # Host header instead of widening the allowlist.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rbacgrant-data
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: store-key
          secret:
            secretName: rbacgrant-store-key
            # Ask for owner-read-only. The kubelet still adds group read
            # because the pod sets fsGroup (which the data volume needs), so
            # the file lands as 0440 root:10001 — readable only by this pod's
            # own user, which the server accepts.
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: rbacgrant
  namespace: rbacgrant
  labels:
    app.kubernetes.io/name: rbacgrant
spec:
  selector:
    app.kubernetes.io/name: rbacgrant
  ports:
    - name: http
      port: 80
      targetPort: http

